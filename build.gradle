plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { name = 'opencollab'; url = 'https://repo.opencollab.dev/main/' }
    maven { name = 'opencollab-snapshots'; url = 'https://repo.opencollab.dev/maven-snapshots/' }
}

dependencies {
    implementation "org.geysermc.mcprotocollib:protocol:${project.mcprotocollib_version}"
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'net.kyori:adventure-api:4.20.0'
    implementation 'net.kyori:adventure-text-serializer-plain:4.20.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

shadowJar {
    archiveBaseName = 'anarchia-bot-runner'
    archiveClassifier = ''
    archiveVersion = ''
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': 'pl.anarchiabot.runner.Main'
    }
}
